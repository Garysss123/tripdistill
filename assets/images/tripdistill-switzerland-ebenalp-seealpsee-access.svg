<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1066" viewBox="0 0 1600 1066" role="img" aria-labelledby="title desc">
  <title id="title">Ebenalp and Seealpsee access choices</title>
  <desc id="desc">A conceptual decision schematic from the rail gateway at Wasserauen: choose the Ebenalp cableway, the named Seealpsee walking loop, or a lower village or city day. Five language columns explain red rail and cableway access, gold signed walking routes, and teal lower elevation alternatives. It is not a geographic map, live timetable, or trail status report.</desc>
  <rect x="0" y="0" width="1600" height="1066" fill="#f3efe4" />
  <rect x="56" y="52" width="1488" height="190" rx="22" fill="#182b39" />
  <text x="96" y="105" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#d7a94b" letter-spacing="2">EASTERN SWITZERLAND · PICK ONE MOUNTAIN ACCESS SYSTEM</text>
  <text x="96" y="164" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">Wasserauen is the gateway, not the itinerary.</text>
  <text x="96" y="207" font-family="Arial, sans-serif" font-size="20" fill="#e0e6e7">Conceptual route choices · not to scale · not a live timetable or trail-status map</text>

  <rect x="74" y="327" width="360" height="500" rx="22" fill="#fffaf0" stroke="#b8c4c4" stroke-width="3" />
  <rect x="74" y="327" width="360" height="58" rx="22" fill="#d71920" />
  <text x="102" y="365" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1">RAIL GATE · SAVE RETURN</text>
  <circle cx="135" cy="450" r="22" fill="#d71920" stroke="#182b39" stroke-width="3" />
  <text x="181" y="458" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#182b39">St Gallen / Appenzell</text>
  <line x1="135" y1="472" x2="135" y2="562" stroke="#d71920" stroke-width="7" />
  <circle cx="135" cy="580" r="28" fill="#d71920" stroke="#182b39" stroke-width="3" />
  <text x="188" y="588" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182b39">Wasserauen</text>
  <text x="102" y="651" font-family="Arial, sans-serif" font-size="19" fill="#344c59">Use SBB for the date-specific journey</text>
  <text x="102" y="682" font-family="Arial, sans-serif" font-size="19" fill="#344c59">and confirm the regional rail return.</text>
  <text x="102" y="735" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#182b39">Choose one branch for the day.</text>
  <text x="102" y="772" font-family="Arial, sans-serif" font-size="17" fill="#647883">Lift, trail and valley fallback are separate.</text>

  <line x1="434" y1="578" x2="524" y2="578" stroke="#416d75" stroke-width="5" />
  <line x1="524" y1="384" x2="524" y2="767" stroke="#416d75" stroke-width="5" />

  <line x1="524" y1="384" x2="620" y2="384" stroke="#d71920" stroke-width="7" />
  <circle cx="524" cy="384" r="13" fill="#d71920" stroke="#182b39" stroke-width="3" />
  <rect x="620" y="292" width="900" height="185" rx="20" fill="#fffaf0" stroke="#92a9aa" stroke-width="3" />
  <rect x="620" y="292" width="16" height="185" rx="8" fill="#d71920" />
  <circle cx="681" cy="335" r="25" fill="#d71920" />
  <text x="681" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">01</text>
  <text x="722" y="344" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182b39">RED · Ebenalp cableway</text>
  <text x="681" y="386" font-family="Arial, sans-serif" font-size="20" fill="#344c59">Wasserauen → Ebenalp → one currently open signed upper route.</text>
  <text x="681" y="421" font-family="Arial, sans-serif" font-size="18" fill="#344c59">Check operator status, the last ascent and the separate trail notice.</text>
  <text x="681" y="453" font-family="Arial, sans-serif" font-size="18" fill="#647883">Return by the verified valley chain; a lift ticket does not open a trail.</text>

  <line x1="524" y1="578" x2="620" y2="578" stroke="#d7a94b" stroke-width="7" />
  <circle cx="524" cy="578" r="13" fill="#d7a94b" stroke="#182b39" stroke-width="3" />
  <rect x="620" y="497" width="900" height="190" rx="20" fill="#fffaf0" stroke="#92a9aa" stroke-width="3" />
  <rect x="620" y="497" width="16" height="190" rx="8" fill="#d7a94b" />
  <circle cx="681" cy="540" r="25" fill="#d7a94b" />
  <text x="681" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#182b39">02</text>
  <text x="722" y="549" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182b39">GOLD · Seealpsee on foot</text>
  <text x="681" y="586" font-family="Arial, sans-serif" font-size="18" fill="#344c59">Wasserauen → Hüttentobel → Klein-/Grosshütten → Seealpsee</text>
  <text x="681" y="616" font-family="Arial, sans-serif" font-size="18" fill="#344c59">→ Seealp → Chobel → Wasserauen; the listed return includes a steep road.</text>
  <text x="681" y="649" font-family="Arial, sans-serif" font-size="17" fill="#344c59">Official listing checked 12 Oct 2026: 7.34 km · +377/−377 m · SAC T2 · about 2 h 30.</text>
  <text x="681" y="674" font-family="Arial, sans-serif" font-size="16" fill="#647883">Published route figures, not a personal pace promise; recheck trail conditions.</text>

  <line x1="524" y1="767" x2="620" y2="767" stroke="#416d75" stroke-width="7" />
  <circle cx="524" cy="767" r="13" fill="#416d75" stroke="#182b39" stroke-width="3" />
  <rect x="620" y="707" width="900" height="120" rx="20" fill="#fffaf0" stroke="#92a9aa" stroke-width="3" />
  <rect x="620" y="707" width="16" height="120" rx="8" fill="#416d75" />
  <circle cx="681" cy="749" r="25" fill="#416d75" />
  <text x="681" y="757" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">03</text>
  <text x="722" y="757" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#182b39">TEAL · Lower weather plan</text>
  <text x="681" y="791" font-family="Arial, sans-serif" font-size="18" fill="#344c59">Appenzell center + one open museum, or St Gallen’s Abbey District when open.</text>
  <text x="681" y="817" font-family="Arial, sans-serif" font-size="17" fill="#647883">Skip ascent when visibility, surface or operation weakens the day.</text>

