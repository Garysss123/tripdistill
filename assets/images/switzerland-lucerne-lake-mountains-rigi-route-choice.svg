<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1066" viewBox="0 0 1600 1066" role="img" aria-labelledby="title desc">
  <title id="title">Rigi route-choice schematic</title>
  <desc id="desc">Three numbered route shapes connect Lucerne with the Rigi railway gateways. The drawing is conceptual and not to scale.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e7eff0"/></linearGradient>
    <linearGradient id="lake" x2="0" y2="1"><stop stop-color="#8ac6d1"/><stop offset="1" stop-color="#3d8196"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172b35" flood-opacity=".12"/></filter>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#c84237"/></marker>
    <marker id="arrow-gold" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#bb7b1d"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#39765e"/></marker>
  </defs>
  <rect width="1600" height="1066" rx="42" fill="url(#paper)"/>
  <path d="M0 770C210 703 346 823 554 760s331-39 493 25 363 45 553-45v326H0Z" fill="#e2d8c2" opacity=".65"/>
  <path d="M0 831c181-51 334 55 492 21s300-45 457 2 409 57 651-6v218H0Z" fill="#c7d8ca" opacity=".72"/>

  <g filter="url(#shadow)">
    <rect x="92" y="106" width="1416" height="802" rx="34" fill="#fffdf8"/>
  </g>

  <!-- Lake Lucerne is a conceptual anchor, not a geographic outline. -->
  <path d="M396 340c92-71 146-36 187 8 50 54 102 59 157 20 55-39 80-39 126 3 51 47 95 38 146-4 41-34 73-37 119-12v180c-59 31-93 34-146 1-45-28-78-18-117 17-55 50-122 49-179-1-48-43-92-44-143 5-42 39-87 39-150-3z" fill="url(#lake)" opacity=".94"/>
  <path d="M435 408c74-31 131 26 191 43s112-23 158-7 78 68 135 62 88-63 147-56" fill="none" stroke="#d7f0ec" stroke-width="10" stroke-linecap="round" opacity=".74"/>

  <!-- Lucerne terminal -->
  <g transform="translate(224 532)">
    <circle r="62" fill="#183b4a"/><circle r="42" fill="#fffdf8"/>
    <path d="M-25 11h50l-7 14h-36zM-18 5l5-20h26l5 20M-9-15v20m18-20v20" fill="none" stroke="#183b4a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-38 35h76" stroke="#c84237" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="224" cy="532" r="80" fill="none" stroke="#183b4a" stroke-width="3" opacity=".18"/>

  <!-- Vitznau and Arth-Goldau gateways -->
  <g transform="translate(1055 287)">
    <circle r="48" fill="#fffdf8" stroke="#183b4a" stroke-width="8"/>
    <path d="M-26 12h52l-7 13h-38zM-18 5l5-21h26l5 21M-9-16v21m18-21v21" fill="none" stroke="#183b4a" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1267 656)">
    <circle r="48" fill="#fffdf8" stroke="#183b4a" stroke-width="8"/>
    <path d="M-26 12h52l-7 13h-38zM-18 5l5-21h26l5 21M-9-16v21m18-21v21" fill="none" stroke="#183b4a" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1396 250)">
    <path d="M-151 84 0-75 151 84" fill="#e9e1ce" stroke="#8a7656" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-93 84-9-18l37 43 30-36 46 95" fill="#8eaa89" stroke="#39765e" stroke-width="8" stroke-linejoin="round"/>
    <path d="m-9-18 37 43 30-36" fill="none" stroke="#f6f0e2" stroke-width="7"/>
  </g>

  <!-- Route 1: lake boat then the Vitznau cogwheel railway. -->
  <path d="M294 515C430 417 604 330 752 313s205-25 258-26" fill="none" stroke="#c84237" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 0" marker-end="url(#arrow-red)"/>
  <g transform="translate(620 363)"><circle r="34" fill="#c84237"/><text x="0" y="12" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">1</text></g>
  <path d="M1091 323C1199 295 1287 275 1352 267" fill="none" stroke="#c84237" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <!-- Route 2: SBB to Arth-Goldau then the mountain railway. -->
  <path d="M290 575C464 676 649 729 824 732s298-23 390-61" fill="none" stroke="#bb7b1d" stroke-width="14" stroke-linecap="round" stroke-dasharray="28 18" marker-end="url(#arrow-gold)"/>
  <g transform="translate(690 709)"><circle r="34" fill="#bb7b1d"/><text x="0" y="12" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">2</text></g>
  <path d="M1311 607C1350 520 1376 435 1389 343" fill="none" stroke="#bb7b1d" stroke-width="12" stroke-linecap="round" stroke-dasharray="22 13" marker-end="url(#arrow-gold)"/>

  <!-- Route 3: lower-elevation Lucerne plan when the mountain day does not fit. -->
  <path d="M224 612c10 104 76 170 180 185 80 12 131-20 169-69" fill="none" stroke="#39765e" stroke-width="13" stroke-linecap="round" stroke-dasharray="5 16" marker-end="url(#arrow-green)"/>
  <g transform="translate(406 770)"><circle r="34" fill="#39765e"/><text x="0" y="12" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">3</text></g>

  <!-- Boarding / rail symbols and numbered legend marks. -->
  <g transform="translate(470 411)" fill="#fffdf8" stroke="#183b4a" stroke-width="6" stroke-linejoin="round">
    <path d="M-44 8h88l-12 25h-64z"/><path d="M-28 6l8-25h40l8 25M-6-19v26m24-26v26" fill="none"/>
    <path d="M-20 40l-10 12m50-12 10 12" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(1118 712)" fill="none" stroke="#183b4a" stroke-width="8" stroke-linecap="round">
    <path d="M-38-27h76v51h-76zM-24-27v-19h48v19M-30 39l-14 18m58-18 14 18"/>
    <circle cx="-20" cy="7" r="7" fill="#183b4a"/><circle cx="20" cy="7" r="7" fill="#183b4a"/>
  </g>
  <g transform="translate(970 844)">
    <path d="M-28 25c-13-29-5-55 20-66 25 11 33 37 20 66z" fill="#e7b94e" stroke="#8d6820" stroke-width="5"/>
    <path d="M-8-18v42m0-22 17-11" fill="none" stroke="#8d6820" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="#183b4a" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="224" y="666" font-size="25" font-weight="700" letter-spacing="3">START NODE</text>
    <text x="1055" y="376" font-size="24" font-weight="700" letter-spacing="2">LAKE GATE</text>
    <text x="1267" y="744" font-size="24" font-weight="700" letter-spacing="2">RAIL GATE</text>
    <text x="1396" y="385" font-size="24" font-weight="700" letter-spacing="2">RIDGE</text>
  </g>
  <rect x="104" y="841" width="384" height="38" rx="19" fill="#183b4a" opacity=".94"/>
  <text x="296" y="868" text-anchor="middle" fill="#fffdf8" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">CONCEPTUAL ROUTE SHAPES · NOT TO SCALE</text>
</svg>
