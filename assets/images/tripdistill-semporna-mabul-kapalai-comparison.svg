<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Semporna, Mabul and Kapalai stay-base comparison</title>
  <desc id="desc">An original non-scale lodging decision diagram with a visible five-language legend. It compares town, inhabited island and reservation-managed resort access; it is not a map or live access guarantee.</desc>
  <defs>
    <linearGradient id="sea" x2="1" y2="1"><stop stop-color="#0c7e8b"/><stop offset="1" stop-color="#25b9af"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1440" height="960" fill="#073749"/>
  <rect width="1440" height="540" fill="url(#sea)"/>
  <rect width="1440" height="540" fill="url(#grid)"/>
  <path d="M0 480 Q170 420 340 472T680 470T1020 462T1440 475V540H0Z" fill="#f4d889" opacity=".85"/>
  <text x="72" y="72" fill="#ffe8a6" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5">TRIPDISTILL · STAY-BASE DECISION · NOT A MAP</text>
  <text x="72" y="137" fill="#fff8e7" font-family="Georgia,serif" font-size="53">Three bases. Three different access contracts.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(72 184)">
      <rect width="390" height="286" rx="22" fill="#fffaf0"/>
      <circle cx="58" cy="58" r="28" fill="#e97059"/><path d="M43 58h30M58 43v30" stroke="#fff" stroke-width="5"/>
      <text x="100" y="65" fill="#073749" font-size="29" font-weight="700">SEMPORNA TOWN</text>
      <text x="28" y="126" fill="#0b777e" font-size="20" font-weight="700">Flexible mainland base</text>
      <text x="28" y="165" fill="#405c5b" font-size="18">Road pickup · public town streets</text>
      <text x="28" y="200" fill="#405c5b" font-size="18">Confirm operator and jetty each trip</text>
      <text x="28" y="245" fill="#b35648" font-size="17" font-weight="700">Best for 3–4 nights · keep one room</text>
    </g>
    <g transform="translate(525 184)">
      <rect width="390" height="286" rx="22" fill="#e6f4ec"/>
      <path d="M30 67l36-38 36 38z" fill="#0e8790"/><path d="M46 67v-22h40v22" fill="#0e8790"/>
      <text x="118" y="65" fill="#073749" font-size="29" font-weight="700">MABUL ISLAND</text>
      <text x="28" y="126" fill="#0b777e" font-size="20" font-weight="700">Inhabited · host-led access</text>
      <text x="28" y="165" fill="#405c5b" font-size="18">Ask which community paths are suitable</text>
      <text x="28" y="200" fill="#405c5b" font-size="18">Respect homes, work and photo consent</text>
      <text x="28" y="245" fill="#b35648" font-size="17" font-weight="700">Confirm property, boat and guest rules</text>
    </g>
    <g transform="translate(978 184)">
      <rect width="390" height="286" rx="22" fill="#fff0d0"/>
      <path d="M29 67h78M40 52h56M52 37h32" stroke="#0e8790" stroke-width="8" stroke-linecap="round"/>
      <text x="128" y="65" fill="#073749" font-size="29" font-weight="700">KAPALAI RESORT</text>
      <text x="28" y="126" fill="#0b777e" font-size="20" font-weight="700">Reservation-gated boardwalk</text>
      <text x="28" y="165" fill="#405c5b" font-size="18">Not a general public promenade</text>
      <text x="28" y="200" fill="#405c5b" font-size="18">Use only areas your host confirms</text>
      <text x="28" y="245" fill="#b35648" font-size="17" font-weight="700">Confirm room, meals and return boat</text>
    </g>
  </g>
  <rect x="0" y="540" width="1440" height="420" fill="#fffaf0"/>
  <text x="72" y="586" fill="#b35648" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">VISIBLE FIVE-LANGUAGE KEY · FIVE語圖例 · 五言語の凡例 · 5개 언어 범례 · คำอธิบาย 5 ภาษา</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#244b50">
    <text x="72" y="638" font-weight="700" fill="#0b777e">EN</text><text x="132" y="638">Town = flexible road base; Mabul = inhabited/host-led; Kapalai = reservation-gated resort.</text>
    <text x="72" y="689" font-weight="700" fill="#0b777e">繁體中文</text><text x="190" y="689">仙本那鎮＝陸路彈性基地；馬布島＝有人居住、依主人指引；卡帕萊＝限預訂住客的度假村。</text>
    <text x="72" y="740" font-weight="700" fill="#0b777e">日本語</text><text x="166" y="740">センポルナ町＝陸路の拠点；マブール島＝居住地・案内に従う；カパライ＝予約者向けリゾート。</text>
    <text x="72" y="791" font-weight="700" fill="#0b777e">한국어</text><text x="166" y="791">셈포르나 시내=육로 거점; 마불섬=주민 거주·호스트 안내 준수; 카팔라이=예약 투숙객 전용 리조트.</text>
    <text x="72" y="842" font-weight="700" fill="#0b777e">ไทย</text><text x="132" y="842">ตัวเมืองเซมปอร์นา=ฐานเดินทางทางถนน; มาบูล=ชุมชนมีผู้อยู่อาศัยและทำตามเจ้าบ้าน; กาปาไล=รีสอร์ตสำหรับผู้จอง</text>
  </g>
  <rect x="72" y="876" width="1296" height="1" fill="#bfd2cc"/>
  <text x="72" y="918" fill="#596e69" font-family="Arial,sans-serif" font-size="16">Diagram is conceptual and not to scale. Confirm exact property, guest access, licensed operator, return boat, meals and current conditions before paying.</text>
</svg>
