<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Jasper is a base for three separate travel corridors</title>
  <desc id="desc">A not-to-scale diagram with Jasper town at the centre, Maligne Valley to the north, and Athabasca Falls, Sunwapta Falls, Columbia Icefield and Lake Louise on the southbound Icefields Parkway. A five-language color legend identifies the Maligne Valley route, the southbound Parkway and the Columbia Icefield marker.</desc>
  <rect x="0" y="0" width="1200" height="700" rx="24" fill="#eef5f3"/>
  <rect id="diagram-frame" x="55" y="55" width="1090" height="615" fill="none" stroke="#bfd4d0" stroke-width="2"/>
  <text x="86" y="104" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#183b3c">Jasper base · three distinct corridors</text>
  <text x="88" y="140" font-family="system-ui,sans-serif" font-size="18" fill="#466260">Schematic only · not to scale · roads and access change by season</text>
  <path d="M240 330C330 300 365 230 465 206" fill="none" stroke="#367d75" stroke-width="10" stroke-linecap="round"/>
  <path d="M240 345C370 370 490 350 605 350S800 350 953 350" fill="none" stroke="#d47a45" stroke-width="10" stroke-linecap="round"/>
  <circle cx="225" cy="338" r="26" fill="#173c3a"/>
  <circle cx="480" cy="202" r="20" fill="#367d75"/>
  <circle cx="376" cy="361" r="12" fill="#d47a45"/>
  <circle cx="480" cy="354" r="12" fill="#d47a45"/>
  <circle cx="690" cy="350" r="20" fill="#9b5c91"/>
  <circle cx="970" cy="350" r="20" fill="#173c3a"/>
  <text x="120" y="390" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#183b3c">JASPER TOWN</text>
  <text x="425" y="176" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#183b3c">MALIGNE VALLEY</text>
  <text x="325" y="410" font-family="system-ui,sans-serif" font-size="17" fill="#183b3c">Athabasca</text>
  <text x="438" y="410" font-family="system-ui,sans-serif" font-size="17" fill="#183b3c">Sunwapta</text>
  <text x="642" y="397" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183b3c">COLUMBIA ICEFIELD</text>
  <text x="930" y="397" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183b3c">LAKE LOUISE</text>
  <text id="falls-distance-note" x="320" y="430" font-family="system-ui,sans-serif" font-size="14" fill="#466260">Falls: Athabasca 30 km; Sunwapta 54 km south of Jasper</text>
  <text id="parkway-distance-note" x="612" y="455" font-family="system-ui,sans-serif" font-size="14" fill="#466260">Highway 93: Jasper to Lake Louise · 232 km</text>
  <rect id="legend-card" x="86" y="476" width="1028" height="178" rx="16" fill="#fff" stroke="#bfd4d0" stroke-width="2"/>
  <g id="route-legend" role="group" aria-label="Route color legend in five languages">
    <text x="108" y="501" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#183b3c">Route color legend · 路線顏色圖例 · ルートの色凡例 · 경로 색상 범례 · คำอธิบายสีเส้นทาง</text>
    <g id="legend-en">
      <line x1="108" y1="522" x2="132" y2="522" stroke="#367d75" stroke-width="5" stroke-linecap="round"/>
      <text x="142" y="527" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">Teal line · Maligne Valley</text>
      <line x1="442" y1="522" x2="466" y2="522" stroke="#d47a45" stroke-width="5" stroke-linecap="round"/>
      <text x="476" y="527" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">Orange line · southbound Parkway</text>
      <circle cx="834" cy="522" r="7" fill="#9b5c91"/>
      <text x="850" y="527" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">Purple marker · Columbia Icefield</text>
    </g>
    <g id="legend-zh-Hant">
      <line x1="108" y1="548" x2="132" y2="548" stroke="#367d75" stroke-width="5" stroke-linecap="round"/>
      <text x="142" y="553" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">青綠線 · 瑪琳谷</text>
      <line x1="442" y1="548" x2="466" y2="548" stroke="#d47a45" stroke-width="5" stroke-linecap="round"/>
      <text x="476" y="553" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">橙線 · 冰原大道南行段</text>
      <circle cx="834" cy="548" r="7" fill="#9b5c91"/>
      <text x="850" y="553" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">紫色標記 · 哥倫比亞冰原</text>
    </g>
    <g id="legend-ja">
      <line x1="108" y1="574" x2="132" y2="574" stroke="#367d75" stroke-width="5" stroke-linecap="round"/>
      <text x="142" y="579" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">青緑の線 · マリーン渓谷</text>
      <line x1="442" y1="574" x2="466" y2="574" stroke="#d47a45" stroke-width="5" stroke-linecap="round"/>
      <text x="476" y="579" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">橙色の線 · アイスフィールド・パークウェイ南行</text>
      <circle cx="834" cy="574" r="7" fill="#9b5c91"/>
      <text x="850" y="579" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">紫色の点 · コロンビア大氷原</text>
    </g>
    <g id="legend-ko">
      <line x1="108" y1="600" x2="132" y2="600" stroke="#367d75" stroke-width="5" stroke-linecap="round"/>
      <text x="142" y="605" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">청록색 선 · 말린 밸리</text>
      <line x1="442" y1="600" x2="466" y2="600" stroke="#d47a45" stroke-width="5" stroke-linecap="round"/>
      <text x="476" y="605" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">주황색 선 · 남행 아이스필즈 파크웨이</text>
      <circle cx="834" cy="600" r="7" fill="#9b5c91"/>
      <text x="850" y="605" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">보라색 표식 · 컬럼비아 아이스필드</text>
    </g>
    <g id="legend-th">
      <line x1="108" y1="626" x2="132" y2="626" stroke="#367d75" stroke-width="5" stroke-linecap="round"/>
      <text x="142" y="631" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">เส้นสีเขียวอมฟ้า · Maligne Valley</text>
      <line x1="442" y1="626" x2="466" y2="626" stroke="#d47a45" stroke-width="5" stroke-linecap="round"/>
      <text x="476" y="631" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">เส้นสีส้ม · Icefields Parkway ไปทางใต้</text>
      <circle cx="834" cy="626" r="7" fill="#9b5c91"/>
      <text x="850" y="631" font-family="system-ui,sans-serif" font-size="13" fill="#183b3c">จุดสีม่วง · Columbia Icefield</text>
    </g>
  </g>
  <text x="955" y="501" font-family="system-ui,sans-serif" font-size="12" fill="#466260">TripDistill original</text>
</svg>
