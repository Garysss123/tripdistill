<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1066" viewBox="0 0 1600 1066" role="img" aria-labelledby="title desc">
  <title id="title">Zermatt mountain access-chain planning schematic</title>
  <desc id="desc">Three numbered paths branch from the Zermatt rail base toward Gornergrat, Sunnegga and Klein Matterhorn. A lower village path is shown as a weather fallback. This is a conceptual planning diagram, not a geographic map and not to scale.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f4f1e8"/><stop offset="1" stop-color="#dfe9e8"/></linearGradient>
    <linearGradient id="ridge" x2="0" y2="1"><stop stop-color="#b9c9c4"/><stop offset="1" stop-color="#e6e7db"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172b35" flood-opacity=".13"/></filter>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#c84237"/></marker>
    <marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#ad741e"/></marker>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#39718a"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7 1 13Z" fill="#39765e"/></marker>
  </defs>
  <rect width="1600" height="1066" rx="42" fill="url(#paper)"/>
  <path d="M0 677 152 564l132 104 185-245 148 169 190-322 188 261 127-156 173 184 131-101 174 219v389H0Z" fill="url(#ridge)" opacity=".62"/>
  <path d="M0 836c221-74 371 25 552-23s286 1 455 35 370 36 593-28v246H0Z" fill="#b6cdbd" opacity=".72"/>
  <g filter="url(#shadow)"><rect x="76" y="80" width="1448" height="860" rx="38" fill="#fffdf8"/></g>

  <!-- Mountain silhouette and lift stations are illustrative anchors only, not mapped positions. -->
  <path d="m1120 318 166-173 82 86 94-112 159 199" fill="#f9fbf7" stroke="#829797" stroke-width="9" stroke-linejoin="round"/>
  <path d="m1284 231 82-86 82 86" fill="none" stroke="#c6d6d1" stroke-width="8"/>
  <path d="M1130 320 1316 286 1462 320" fill="none" stroke="#829797" stroke-width="7" stroke-dasharray="10 16"/>

  <!-- Zermatt rail base -->
  <g transform="translate(250 489)">
    <circle r="73" fill="#183b4a"/><circle r="51" fill="#fffdf8"/>
    <path d="M-31 12h62l-9 17h-44zM-23 5l6-29h34l6 29M-10-24v29m20-29v29" fill="none" stroke="#183b4a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-43 39h86" stroke="#c84237" stroke-width="8" stroke-linecap="round"/>
    <circle r="88" fill="none" stroke="#183b4a" stroke-width="3" opacity=".16"/>
  </g>

  <!-- 1: Gornergrat Railway. -->
  <path d="M332 451C487 317 648 252 819 252s186 8 298 35" fill="none" stroke="#c84237" stroke-width="15" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <path d="M1118 287 1237 256" fill="none" stroke="#c84237" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <g transform="translate(648 275)"><circle r="38" fill="#c84237"/><text y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">1</text></g>

  <!-- 2: Sunnegga funicular and the separate Blauherd trail access. -->
  <path d="M327 489C490 488 622 492 767 491s199-7 302-4" fill="none" stroke="#ad741e" stroke-width="15" stroke-linecap="round" stroke-dasharray="27 17" marker-end="url(#arrow-gold)"/>
  <path d="M1065 488c95-37 143-82 198-136" fill="none" stroke="#ad741e" stroke-width="12" stroke-linecap="round" stroke-dasharray="20 14" marker-end="url(#arrow-gold)"/>
  <g transform="translate(693 448)"><circle r="38" fill="#ad741e"/><text y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">2</text></g>
  <g transform="translate(935 489)" fill="none" stroke="#183b4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-31 17 30-18M-20 10l15 27m3-38L14 25M-37 27h74"/>
    <circle cx="-26" cy="-16" r="9" fill="#fffdf8"/><circle cx="26" cy="-16" r="9" fill="#fffdf8"/>
  </g>

  <!-- 3: Furi–Schwarzsee–Trockener Steg–Klein Matterhorn lift chain. -->
  <path d="M326 530C490 656 618 730 785 732s206-66 292-136" fill="none" stroke="#39718a" stroke-width="15" stroke-linecap="round" stroke-dasharray="4 17" marker-end="url(#arrow-blue)"/>
  <path d="M1070 596c109-74 164-150 211-244" fill="none" stroke="#39718a" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 15" marker-end="url(#arrow-blue)"/>
  <g transform="translate(679 707)"><circle r="38" fill="#39718a"/><text y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">3</text></g>
  <g transform="translate(929 711)" fill="none" stroke="#183b4a" stroke-width="8" stroke-linecap="round">
    <path d="M-38-27h76v51h-76zM-24-27v-19h48v19M-30 39l-14 18m58-18 14 18"/>
    <circle cx="-20" cy="7" r="7" fill="#183b4a"/><circle cx="20" cy="7" r="7" fill="#183b4a"/>
  </g>

  <!-- Lower village walk fallback. -->
  <path d="M250 576c-8 114 64 196 171 211 84 11 137-12 179-62" fill="none" stroke="#39765e" stroke-width="14" stroke-linecap="round" stroke-dasharray="5 17" marker-end="url(#arrow-green)"/>
  <g transform="translate(423 778)"><circle r="38" fill="#39765e"/><text y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">4</text></g>
  <g transform="translate(579 735)" fill="none" stroke="#183b4a" stroke-width="7" stroke-linejoin="round">
    <path d="M-43 4 0-28 43 4v48h-86zM-14 52V20h28v32M-34 14h15v15h-15zm38 0h15v15H4z"/>
  </g>

  <!-- Transfer nodes are symbolic anchors only; the adjacent legend names the localized routes. -->
  <g fill="#fffdf8" stroke="#183b4a" stroke-width="7">
    <circle cx="1109" cy="287" r="25"/><circle cx="1063" cy="488" r="25"/><circle cx="1065" cy="596" r="25"/><circle cx="1221" cy="352" r="25"/><circle cx="1286" cy="230" r="25"/>
  </g>
</svg>
