  <path d="M462 330c37-92 91-151 177-162 87 5 152 70 174 160-15 67-84 106-173 108-92-1-154-36-178-106Z" fill="url(#island)" filter="url(#shadow)"/>
  <path d="M506 320c31-72 78-114 135-119 66 6 111 50 133 118-19 50-67 78-134 80-64-2-113-30-134-79Z" fill="#7ea962" opacity=".8"/>
  <ellipse cx="650" cy="330" rx="68" ry="42" fill="#5daeb0" stroke="#d9eee1" stroke-width="8"/>
