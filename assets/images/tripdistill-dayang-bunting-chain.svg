<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Dayang Bunting boat-to-lake planning diagram</title>
  <desc id="desc">An original, non-geographic sequence diagram from mainland pickup to confirmed jetty, boat crossing, island landing, forest walk and freshwater lake, then back along the same chain.</desc>
  <metadata>TripDistill project original; no separate reuse license declared. Planning schematic only: not a geographic map and not to scale.</metadata>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dff1e8"/><stop offset="1" stop-color="#f7f0d9"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#7ab9b0"/><stop offset="1" stop-color="#267e7a"/></linearGradient>
    <linearGradient id="island" x2="0" y2="1"><stop stop-color="#6c9c58"/><stop offset="1" stop-color="#285c4d"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173f37" flood-opacity=".18"/></filter>
  </defs>
  <rect width="960" height="640" rx="34" fill="url(#sky)"/>
