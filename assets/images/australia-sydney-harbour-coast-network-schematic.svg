<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sydney harbour and coast planning schematic</title>
  <desc id="desc">A not-to-scale planning diagram connecting the CBD and Circular Quay to the Opera House and Botanic Garden, a ferry toward Manly and a bus transfer toward the Bondi to Coogee coastal walk. The legend is shown in English, Traditional Chinese, Japanese, Korean and Thai.</desc>
  <defs>
    <style>
      .bg{fill:#f3eee3}.panel{fill:#fffaf0;stroke:#c9c1b2;stroke-width:2}.ink{fill:#173d46}.muted{fill:#546a68}.small{font:700 20px Arial,sans-serif;letter-spacing:2px}.title{font:900 42px Arial,sans-serif;letter-spacing:-1px}.place{font:800 23px Arial,sans-serif}.sub{font:600 17px Arial,sans-serif}.mode{font:800 16px Arial,sans-serif;letter-spacing:1px}.legend{font:600 18px Arial,sans-serif}.micro{font:600 16px Arial,sans-serif}.rail{fill:none;stroke:#b8582d;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.ferry{fill:none;stroke:#187b93;stroke-width:9;stroke-linecap:round;stroke-dasharray:20 15}.bus{fill:none;stroke:#36744c;stroke-width:8;stroke-linecap:round;stroke-dasharray:3 15}.walk{fill:none;stroke:#d39931;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fffaf0;stroke:#173d46;stroke-width:5}.transfer{fill:#173d46}.water{fill:#d9edf0;stroke:#b4d8dd;stroke-width:2}.rule{stroke:#d7d0c3;stroke-width:2}
    </style>
  </defs>
